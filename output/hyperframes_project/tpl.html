<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "MontX"; src: url("assets/montserrat-800.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "MontX"; src: url("assets/montserrat-900.woff2") format("woff2"); font-weight: 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: "MontX", "Inter", sans-serif; }
      #cam, #snap, #drift, #punch { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
      #a-roll { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #topshade { position: absolute; left: 0; right: 0; top: 0; height: 720px; pointer-events: none;
        background: linear-gradient(to bottom, rgba(0,0,0,.58) 0%, rgba(0,0,0,.44) 15%, rgba(0,0,0,.19) 27%, rgba(0,0,0,0) 37%); }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      .cap { position: absolute; left: 84px; top: 250px; width: 820px; color: #fff; }
      .l1 { font-weight: 900; font-size: 68px; line-height: 1.1; letter-spacing: -0.5px; }
      .l2 { font-weight: 800; font-size: 50px; line-height: 1.15; margin-top: 6px; }
      .l2.big { font-weight: 900; font-size: 88px; letter-spacing: -1px; margin-top: 2px; }
      .w { display: inline-block; -webkit-text-stroke: 3px rgba(0,0,0,.42); paint-order: stroke fill; opacity: 0; transform-origin: 50% 80%;
        text-shadow: 0 0 2px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.35), 0 6px 22px rgba(0,0,0,.45); }
      .ico { display: inline-block; vertical-align: -0.08em; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1080" data-height="1920">
      <div id="cam"><div id="snap"><div id="drift"><div id="punch">
        <video id="a-roll" class="clip" src="base.mp4" playsinline muted data-start="0" data-duration="18" data-track-index="0"></video>
      </div></div></div></div>
      <div id="topshade"></div>
      <div id="flash"></div>
      <audio id="music" class="clip" src="assets/music.wav" data-start="0" data-duration="18" data-track-index="1" data-volume="1"></audio>
      <!--CAPS-->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      //JS
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
